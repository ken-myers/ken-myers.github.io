stages:
  - mirror

variables:
  GIT_DEPTH: "0"
  GITHUB_REPO: "ken-myers/ken-myers.github.io"
  GITHUB_BRANCH: "master"

mirror_to_github:
  stage: mirror
  image: alpine:3.20
  resource_group: github-mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache git openssh-client
    - test -n "$GITHUB_DEPLOY_KEY" || (echo "Set GITHUB_DEPLOY_KEY as a file variable in GitLab CI/CD variables." && exit 1)
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - (cat "$GITHUB_DEPLOY_KEY"; printf '\n') | tr -d '\r' > ~/.ssh/github_deploy_key
    - chmod 400 ~/.ssh/github_deploy_key
    - ssh-keygen -y -f ~/.ssh/github_deploy_key > /dev/null
    - ssh-add ~/.ssh/github_deploy_key
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git remote add github "git@github.com:${GITHUB_REPO}.git"
    - git push --force github "$CI_COMMIT_SHA:refs/heads/${GITHUB_BRANCH}"
